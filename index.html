    <!-- Sound & Game Logic Script -->
    <script>
        class SoundFX {
            constructor() { this.ctx = null; }
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }
            playCoin() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1600, this.ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.1);
            }
            playJump() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(400, this.ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.15);
            }
            playCrash() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(120, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.5, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.3);
            }
        }
        const sfx = new SoundFX();

        const characters = [
            { id: 0, name: "Yafiz Runner", color: 0xff3366, capColor: 0x00ccff, price: 0, unlocked: true },
            { id: 1, name: "Cyber Ninja", color: 0x33ff66, capColor: 0x111111, price: 0, unlocked: true },
            { id: 2, name: "Golden Star", color: 0xffcc00, capColor: 0xff3300, price: 0, unlocked: true },
            { id: 3, name: "Neon Racer", color: 0x00ffff, capColor: 0xff00ff, price: 50, unlocked: false },
            { id: 4, name: "Magma Blaze", color: 0xff4500, capColor: 0x222222, price: 100, unlocked: false },
            { id: 5, name: "Shadow Boss", color: 0x8a2be2, capColor: 0xffd700, price: 200, unlocked: false }
        ];

        let selectedCharacterId = 0;
        let totalCoins = parseInt(localStorage.getItem('yafiz_total_coins') || '0');
        let unlockedChars = JSON.parse(localStorage.getItem('yafiz_unlocked_chars') || '[0,1,2]');

        characters.forEach(c => {
            if (unlockedChars.includes(c.id)) c.unlocked = true;
        });

        const LANES = [-2.5, 0, 2.5];
        let scene, camera, renderer;
        let playerGroup, playerBody;
        let gameRunning = false;
        let currentLane = 1;
        let targetX = 0;
        
        let playerY = 0;
        let isJumping = false;
        let isSliding = false;
        let jumpVelocity = 0;
        const gravity = -35;
        const jumpPower = 12;

        let tracks = [];
        let obstacles = [];
        let coins = [];

        let speed = 25;
        const baseSpeed = 25;
        const maxSpeed = 55;
        let distance = 0;
        let score = 0;
        let coinCount = 0;
        let highScore = localStorage.getItem('yafiz_express_highscore') || 0;

        let touchStartX = 0;
        let touchStartY = 0;

        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const hud = document.getElementById('hud');
        const scoreText = document.getElementById('score-text');
        const coinsText = document.getElementById('coins-text');
        const finalScoreText = document.getElementById('final-score');
        const highScoreText = document.getElementById('high-score');
        const finalCoinsText = document.getElementById('final-coins');

        function renderCharacterSelector() {
            const grid = document.getElementById('character-select-grid');
            grid.innerHTML = '';
            characters.forEach(char => {
                const isSelected = char.id === selectedCharacterId;
                const card = document.createElement('div');
                card.className = `p-2.5 rounded-2xl border-2 flex flex-col items-center justify-between cursor-pointer transition ${
                    isSelected ? 'border-yellow-400 bg-yellow-400/20 scale-105' : 'border-white/10 bg-slate-800/60 hover:bg-slate-800'
                }`;
                
                card.innerHTML = `
                    <div class="w-10 h-10 rounded-full mb-1 flex items-center justify-center font-bold text-white shadow-md" style="background-color: #${char.color.toString(16)}">
                        🏃
                    </div>
                    <span class="text-xs font-bold text-white text-center truncate w-full">${char.name}</span>
                    <span class="text-[10px] mt-1 px-2 py-0.5 rounded-full font-bold ${
                        char.unlocked ? (isSelected ? 'bg-yellow-400 text-slate-950' : 'bg-green-500/20 text-green-400') : 'bg-amber-500/20 text-amber-300'
                    }">
                        ${char.unlocked ? (isSelected ? 'ACTIVE' : 'SELECT') : '🪙 ' + char.price}
                    </span>
                `;

                card.onclick = () => {
                    if (char.unlocked) {
                        selectedCharacterId = char.id;
                        renderCharacterSelector();
                    } else {
                        if (totalCoins >= char.price) {
                            totalCoins -= char.price;
                            localStorage.setItem('yafiz_total_coins', totalCoins);
                            char.unlocked = true;
                            unlockedChars.push(char.id);
                            localStorage.setItem('yafiz_unlocked_chars', JSON.stringify(unlockedChars));
                            selectedCharacterId = char.id;
                            renderCharacterSelector();
                        } else {
                            alert("Not enough coins to unlock this character!");
                        }
                    }
                };
                grid.appendChild(card);
            });
        }

        function initThree() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x3a88e9);
            scene.fog = new THREE.FogExp2(0x3a88e9, 0.015);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
            camera.position.set(0, 4.5, 8);
            camera.rotation.x = -0.25;

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xfffaed, 0.8);
            dirLight.position.set(20, 40, 20);
            dirLight.castShadow = true;
            scene.add(dirLight);

            createPlayer();

            for (let i = 0; i < 10; i++) {
                createTrackTile(-i * 30);
            }

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        function createPlayer() {
            if (playerGroup) scene.remove(playerGroup);
            playerGroup = new THREE.Group();

            const charData = characters.find(c => c.id === selectedCharacterId) || characters[0];

            const bodyGeo = new THREE.BoxGeometry(0.8, 1.2, 0.5);
            const playerMat = new THREE.MeshStandardMaterial({ color: charData.color, roughness: 0.3 });
            playerBody = new THREE.Mesh(bodyGeo, playerMat);
            playerBody.position.y = 0.9;
            playerBody.castShadow = true;
            playerGroup.add(playerBody);

            const headGeo = new THREE.SphereGeometry(0.35, 16, 16);
            const headMat = new THREE.MeshStandardMaterial({ color: 0xffcc99 });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.set(0, 0.85, 0);
            playerBody.add(head);

            const capGeo = new THREE.ConeGeometry(0.38, 0.25, 16);
            const capMat = new THREE.MeshStandardMaterial({ color: charData.capColor });
            const cap = new THREE.Mesh(capGeo, capMat);
            cap.position.set(0, 0.25, -0.05);
            cap.rotation.x = -0.2;
            head.add(cap);

            const brimGeo = new THREE.BoxGeometry(0.4, 0.04, 0.3);
            const brim = new THREE.Mesh(brimGeo, capMat);
            brim.position.set(0, -0.08, 0.25);
            cap.add(brim);

            const boardGeo = new THREE.BoxGeometry(0.9, 0.1, 2.0);
            const boardMat = new THREE.MeshStandardMaterial({ color: 0xffcc00, roughness: 0.2 });
            const board = new THREE.Mesh(boardGeo, boardMat);
            board.position.set(0, -0.65, 0);
            board.castShadow = true;
            playerBody.add(board);

            scene.add(playerGroup);
        }

        function createTrackTile(zPos) {
            const tileGroup = new THREE.Group();
            tileGroup.position.z = zPos;

            const groundGeo = new THREE.BoxGeometry(10, 0.4, 30);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x22252a, roughness: 0.8 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.position.y = -0.2;
            tileGroup.add(ground);

            [-1.25, 1.25].forEach(x => {
                const lineGeo = new THREE.BoxGeometry(0.15, 0.02, 30);
                const lineMat = new THREE.MeshBasicMaterial({ color: 0xffb703 });
                const line = new THREE.Mesh(lineGeo, lineMat);
                line.position.set(x, 0.01, 0);
                tileGroup.add(line);
            });

            [-4.8, 4.8].forEach(x => {
                const curbGeo = new THREE.BoxGeometry(0.4, 0.6, 30);
                const curbMat = new THREE.MeshStandardMaterial({ color: 0xcc3333 });
                const curb = new THREE.Mesh(curbGeo, curbMat);
                curb.position.set(x, 0.1, 0);
                tileGroup.add(curb);
            });

            [-9, 9].forEach(x => {
                const bldgHeight = 15 + Math.random() * 20;
                const bldgGeo = new THREE.BoxGeometry(7, bldgHeight, 28);
                const bldgMat = new THREE.MeshStandardMaterial({ color: 0x3a5a40, roughness: 0.7 });
                const bldg = new THREE.Mesh(bldgGeo, bldgMat);
                bldg.position.set(x, bldgHeight / 2 - 0.2, 0);
                tileGroup.add(bldg);
            });

            scene.add(tileGroup);
            tracks.push(tileGroup);

            if (zPos < -30) {
                spawnTileContent(zPos);
            }
        }

        function spawnTile
